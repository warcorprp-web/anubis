version: '3.8'

services:
  anubis:
    build: .
    container_name: anubis-proxy
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
      - "1455:1455"    # Codex OAuth
      - "8085:8085"    # Gemini CLI OAuth
      - "8086:8086"    # Gemini Antigravity OAuth
      - "8087:8087"    # iFlow OAuth
      - "19876-19880:19876-19880"  # Kiro OAuth (range)
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REQUIRED_API_KEY=${REQUIRED_API_KEY:-change-me}
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
